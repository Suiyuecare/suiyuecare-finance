name: Finance Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Verify adopted database lineage and immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FINANCE_BUILD_TARGET: preview
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use fixed Node 22 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Use fixed pnpm runtime
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.21.0
          run_install: false

      - name: Install locked verification dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove preview is offline and production fails closed
        run: pnpm release:environment-isolation

      - name: Prove the protected production release cannot bypass DB rehearsal or candidate verification
        run: pnpm release:production-contract

      - name: Reject incomplete source and known incident regressions before build
        run: pnpm release:preflight

      - name: Build and verify the exact Vercel candidate
        run: pnpm release:build

      - name: Re-verify artifact hashes and built regressions
        run: pnpm release:verify-artifact

      - name: Upload immutable verified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: www
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: true

  interaction-gate:
    name: Verify actual form and management actions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      history-search-postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: finance_browser_fixture_only
          POSTGRES_DB: postgres
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FINANCE_BUILD_TARGET: local
      FINANCE_BROWSER_CHANNEL: chromium
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use fixed Node 22 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Use fixed pnpm runtime
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.21.0
          run_install: false
      - name: Install locked dependencies and browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium webkit
      - name: Configure private disposable PostgreSQL for browser concurrency
        env:
          FINANCE_NATIVE_PG_CONFIG: ${{ runner.temp }}/finance-history-summary-pg.json
          FINANCE_FIXTURE_PG_PASSWORD: finance_browser_fixture_only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = process.env.FINANCE_NATIVE_PG_CONFIG;
          if (path.dirname(path.resolve(file)) !== path.resolve(process.env.RUNNER_TEMP)) throw new Error('Browser fixture config must remain outside the source checkout');
          fs.writeFileSync(file, JSON.stringify({host:'127.0.0.1',port:5432,user:'postgres',password:process.env.FINANCE_FIXTURE_PG_PASSWORD,database:'postgres'}), {mode:0o600,flag:'wx'});
          NODE
          node <<'NODE'
          const fs = require('node:fs');
          const {Client} = require('pg');
          const configuration = JSON.parse(fs.readFileSync(process.env.FINANCE_NATIVE_PG_CONFIG,'utf8'));
          if (configuration.host !== '127.0.0.1' || configuration.port !== 5432) throw new Error('Fixture role setup is restricted to the workflow-owned PostgreSQL service');
          (async()=>{const client=new Client(configuration);await client.connect();try {
            for (const role of ['anon','authenticated','service_role']) {
              if (!(await client.query('select 1 from pg_roles where rolname=$1',[role])).rowCount) await client.query('create role '+role);
            }
          } finally {await client.end();}})().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - name: Install verified PostgREST for isolated HTTP transaction acceptance
        shell: bash
        run: |
          set -euo pipefail
          POSTGREST_DIR="$RUNNER_TEMP/finance-postgrest"
          mkdir -p "$POSTGREST_DIR"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/PostgREST/postgrest/releases/download/v13.0.7/postgrest-v13.0.7-linux-static-x86-64.tar.xz \
            --output "$POSTGREST_DIR/postgrest.tar.xz"
          printf '%s  %s\n' 4153f81ccc40e7b735edc89cd84b49da25ba27eb37d57c7f6a82c9005a0b762b "$POSTGREST_DIR/postgrest.tar.xz" | sha256sum --check --strict
          tar -xJf "$POSTGREST_DIR/postgrest.tar.xz" -C "$POSTGREST_DIR" postgrest
          test -x "$POSTGREST_DIR/postgrest"
          "$POSTGREST_DIR/postgrest" --version

      - name: Verify real DOM actions with isolated fictional data
        env:
          FINANCE_NATIVE_PG_CONFIG: ${{ runner.temp }}/finance-history-summary-pg.json
          FINANCE_POSTGREST_BIN: ${{ runner.temp }}/finance-postgrest/postgrest
        run: |
          node scripts/check_formal_tus_browser_integration.cjs
          node scripts/check_admin_action_browser.cjs
          node scripts/check_shareholder_invoice_ocr_browser.cjs
          node scripts/check_personnel_login_browser.cjs
          node scripts/check_finance_auth_recovery_browser.cjs
          node scripts/check_finance_oauth_error_browser.cjs
          pnpm test:procurement-closeout-browser
          pnpm test:bank-fee-review-browser
          pnpm test:mega-remittance-browser
          pnpm test:personnel-save-browser
          pnpm test:personnel-workspace-browser
          pnpm test:history-search-browser
          pnpm test:deferred-startup-browser
          pnpm test:notification-paging-browser
          pnpm test:personal-bill-batch-history-browser
          pnpm test:short-batch-numbers-browser
          pnpm test:bill-form-attachments-browser
          pnpm test:applicant-history-withdraw-browser
          pnpm test:finance-oauth-account-guard-browser
          FINANCE_HISTORY_NATIVE_REQUIRED=1 pnpm test:personal-bill-batch-history
          FINANCE_HISTORY_NATIVE_REQUIRED=1 pnpm test:personal-history-identity-once
          FINANCE_INVOICE_NATIVE_REQUIRED=1 pnpm test:invoice-batch-bulk
          FINANCE_BILL_APPROVAL_NATIVE_REQUIRED=1 pnpm test:bill-approval-bulk
          FINANCE_INVOICE_APPROVAL_NATIVE_REQUIRED=1 pnpm test:invoice-approval-bulk
          node scripts/check_approval_committed_feedback_browser_20261021.cjs
          pnpm test:taipei2-applicant-confirm-browser
          pnpm test:income-rpc-http
          pnpm test:income-recovery-storage-browser
          pnpm test:org-chart-browser
          node scripts/check_human_accounting_browser_20261002.cjs
          FINANCE_BROWSER_CHANNEL=chromium node scripts/check_invoice_table_layout_browser.cjs --review-only
          pnpm test:select-scroll-browser
          FINANCE_BROWSER_CHANNEL=chromium pnpm test:invoice-item-bind-browser
          pnpm test:history-summary-browser
          pnpm test:finance-ui-interactions
          pnpm test:audit-controls-native-concurrency
          pnpm test:audit-controls-browser-20260927
          pnpm test:hr-contractor-browser
          pnpm test:hr-contractor-native
          pnpm test:portal-session
          pnpm test:external-labor-browser

      - name: Verify measured submission acceptance manifest
        run: node scripts/check_submission_acceptance_manifest.cjs

      - name: Retain isolated invoice batch reliability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finance-invoice-batch-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/finance-invoice-batch-bulk-20261014
            /tmp/finance-bill-approval-bulk-20261015
            /tmp/finance-invoice-approval-bulk-20261021
            /tmp/finance-approval-committed-feedback-browser-20261021
            /tmp/finance-taipei2-applicant-confirm-browser-20261015
            /tmp/finance-income-rpc-http-20261014
            /tmp/finance-income-recovery-storage-browser
            /tmp/finance-submission-acceptance-20261014
          if-no-files-found: warn
          retention-days: 14

      - name: Retain fictional personnel and history continuity evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finance-personnel-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/finance-personnel-workspace-20261012
            /tmp/finance-history-continuity-20261012
          if-no-files-found: warn
          retention-days: 14

      - name: Retain fictional OAuth account boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finance-oauth-account-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/finance-oauth-account-guard-browser-20261013
          if-no-files-found: warn
          retention-days: 14

      - name: Retain fictional searchable-select evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finance-select-scroll-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/finance-select-scroll-20261012
          if-no-files-found: warn
          retention-days: 14

      - name: Retain fictional organization chart evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-org-chart-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/finance-org-chart-clarity-browser
          if-no-files-found: warn
          retention-days: 7

      - name: Retain fictional search acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-history-summary-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/finance-search-summary-acceptance-20260915
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
      - name: Retain fictional UI interaction evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-ui-interactions-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/finance-ui-interaction-20260922
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
      - name: Retain fictional Mega remittance evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-mega-remittance-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/finance-mega-app-evidence
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

      - name: Retain fictional audit controls evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-audit-controls-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/finance-accounting-controls-20260927
            /tmp/finance-approval-search-selection-20260927
            /tmp/finance-payroll-accrual-20260927
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
      - name: Verify actual bundled startup and workspace navigation
        run: |
          node scripts/build_www.js
          node scripts/check_startup_bundle_browser.cjs
