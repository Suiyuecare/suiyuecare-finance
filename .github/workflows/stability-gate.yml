name: Finance Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Verify adopted database lineage and immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINANCE_BUILD_TARGET: preview
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use fixed Node 22 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Use fixed pnpm runtime
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.21.0
          run_install: false

      - name: Install locked verification dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove preview is offline and production fails closed
        run: pnpm release:environment-isolation

      - name: Prove the protected production release cannot bypass DB rehearsal or candidate verification
        run: pnpm release:production-contract

      - name: Reject incomplete source and known incident regressions before build
        run: pnpm release:preflight

      - name: Build and verify the exact Vercel candidate
        run: pnpm release:build

      - name: Re-verify artifact hashes and built regressions
        run: pnpm release:verify-artifact

      - name: Upload immutable verified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: www
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: true

  interaction-gate:
    name: Verify actual form and management actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      history-search-postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: finance_browser_fixture_only
          POSTGRES_DB: postgres
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FINANCE_BUILD_TARGET: local
      FINANCE_BROWSER_CHANNEL: chromium
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use fixed Node 22 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Use fixed pnpm runtime
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.21.0
          run_install: false
      - name: Install locked dependencies and browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Configure private disposable PostgreSQL for browser concurrency
        env:
          FINANCE_NATIVE_PG_CONFIG: ${{ runner.temp }}/finance-history-summary-pg.json
          FINANCE_FIXTURE_PG_PASSWORD: finance_browser_fixture_only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = process.env.FINANCE_NATIVE_PG_CONFIG;
          if (path.dirname(path.resolve(file)) !== path.resolve(process.env.RUNNER_TEMP)) throw new Error('Browser fixture config must remain outside the source checkout');
          fs.writeFileSync(file, JSON.stringify({host:'127.0.0.1',port:5432,user:'postgres',password:process.env.FINANCE_FIXTURE_PG_PASSWORD,database:'postgres'}), {mode:0o600,flag:'wx'});
          NODE
      - name: Verify real DOM actions with isolated fictional data
        env:
          FINANCE_NATIVE_PG_CONFIG: ${{ runner.temp }}/finance-history-summary-pg.json
        run: |
          node scripts/check_admin_action_browser.cjs
          node scripts/check_shareholder_invoice_ocr_browser.cjs
          node scripts/check_personnel_login_browser.cjs
          pnpm test:history-summary-browser
          pnpm test:finance-ui-interactions

      - name: Retain fictional search acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-history-summary-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/finance-search-summary-acceptance-20260915
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
      - name: Retain fictional UI interaction evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-ui-interactions-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/finance-ui-interaction-20260922
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
      - name: Verify actual bundled startup and workspace navigation
        run: |
          node scripts/build_www.js
          node scripts/check_startup_bundle_browser.cjs
