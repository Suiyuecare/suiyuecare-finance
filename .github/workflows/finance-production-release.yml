            --candidate-sha "$CANDIDATE_SHA" --release-phase "$RELEASE_PHASE" \
            --migration-versions "$MIGRATION_VERSIONS" \
            --deployment-url "$DEPLOYMENT_URL" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          DEPLOYMENT_HOST="${DEPLOYMENT_URL#https://}"
          DEPLOYMENT_HOST="${DEPLOYMENT_HOST%/}"
