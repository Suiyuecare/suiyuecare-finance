name: Finance Protected Production Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current protected-main commit (40 lowercase hex)
        required: true
        type: string
      release_phase:
        description: frontend_compat publishes UI after all reviewed migrations; database_invoice_read_scope_20260915 applies the exact invoice SELECT policy optimization
        required: true
        type: choice
        options:
          - frontend_compat
          - database_invoice_read_scope_20260915
      migration_versions:
        description: frontend_compat=none; database_invoice_read_scope_20260915=20260915080928
        required: true
        type: string
      confirmation:
        description: Type PROMOTE FINANCE PRODUCTION
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: finance-production-release
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and seal the immutable candidate before DB mutation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      history-search-postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: finance_browser_fixture_only
          POSTGRES_DB: postgres
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    environment:
      name: finance-production
    outputs:
      deployment_url: ${{ steps.deploy_candidate.outputs.deployment_url }}
      deployment_id: ${{ steps.deploy_candidate.outputs.deployment_id }}
      manifest_sha256: ${{ steps.deploy_candidate.outputs.manifest_sha256 }}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RELEASE_PHASE: ${{ inputs.release_phase }}
      MIGRATION_VERSIONS: ${{ inputs.migration_versions }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      FINANCE_BUILD_TARGET: production
      VERCEL_ENV: production
      VERCEL_GIT_COMMIT_SHA: ${{ inputs.candidate_sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FINANCE_SUPABASE_URL: ${{ secrets.FINANCE_PRODUCTION_SUPABASE_URL }}
      FINANCE_SUPABASE_ANON_KEY: ${{ secrets.FINANCE_PRODUCTION_SUPABASE_ANON_KEY }}
      FINANCE_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FINANCE_PRODUCTION_SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.FINANCE_PRODUCTION_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.FINANCE_PRODUCTION_VERCEL_PROJECT_ID }}
      NO_COLOR: "1"
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout current protected main without private-repository refetch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Use fixed Node 22 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Use fixed pnpm runtime
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.21.0
          run_install: false

      - name: Install locked verification dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail closed unless source, phase and immutable target are exact
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_CONFIRMATION" = "PROMOTE FINANCE PRODUCTION"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_NAME" = "main"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          node scripts/finance_production_release_guard.js validate-target \
            --candidate-sha "$CANDIDATE_SHA" \
            --release-phase "$RELEASE_PHASE" \
            --migration-versions "$MIGRATION_VERSIONS" \
            --project-ref "$FINANCE_PRODUCTION_SUPABASE_PROJECT_REF"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm release:preflight

      - name: Configure private disposable PostgreSQL for browser concurrency
        env:
          FINANCE_NATIVE_PG_CONFIG: ${{ runner.temp }}/finance-history-summary-pg.json
          FINANCE_FIXTURE_PG_PASSWORD: finance_browser_fixture_only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = process.env.FINANCE_NATIVE_PG_CONFIG;
          if (path.dirname(path.resolve(file)) !== path.resolve(process.env.RUNNER_TEMP)) throw new Error('Browser fixture config must remain outside the source checkout');
          fs.writeFileSync(file, JSON.stringify({host:'127.0.0.1',port:5432,user:'postgres',password:process.env.FINANCE_FIXTURE_PG_PASSWORD,database:'postgres'}), {mode:0o600,flag:'wx'});
          NODE

      - name: Verify real offline DOM actions before building the production candidate
        shell: bash
        env:
          FINANCE_BROWSER_CHANNEL: chromium
          FINANCE_NATIVE_PG_CONFIG: ${{ runner.temp }}/finance-history-summary-pg.json
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          node scripts/check_admin_action_browser.cjs
          node scripts/check_shareholder_invoice_ocr_browser.cjs
          node scripts/check_personnel_login_browser.cjs
          pnpm test:history-summary-browser

      - name: Retain fictional search acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-history-summary-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/finance-search-summary-acceptance-20260915
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

      - name: Build and fully verify exact production artifact
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx vercel@59.3.0 pull --yes --environment=production
          node -e 'const f=require("./.vercel/project.json"); if(f.orgId!==process.env.VERCEL_ORG_ID||f.projectId!==process.env.VERCEL_PROJECT_ID) throw new Error("pulled Vercel link differs from immutable catalog")'
          pnpm dlx vercel@59.3.0 build --prod --standalone
          pnpm release:verify-artifact

      - name: Deploy unaliased candidate and inspect immutable Vercel target
        id: deploy_candidate
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(pnpm dlx vercel@59.3.0 deploy --prebuilt --prod --skip-domain --yes --meta "financeCandidateSha=$CANDIDATE_SHA")"
          [[ "$DEPLOYMENT_URL" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app/?$ ]]
          DEPLOYMENT_URL="${DEPLOYMENT_URL%/}/"
          DEPLOYMENT_HOST="${DEPLOYMENT_URL#https://}"
          DEPLOYMENT_HOST="${DEPLOYMENT_HOST%/}"
          pnpm dlx vercel@59.3.0 inspect "$DEPLOYMENT_URL" --wait --timeout=10m
          pnpm dlx vercel@59.3.0 api "/v13/deployments/${DEPLOYMENT_HOST}?teamId=${VERCEL_ORG_ID}" > "$RUNNER_TEMP/candidate-deployment.json"
          pnpm dlx vercel@59.3.0 api "/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" > "$RUNNER_TEMP/vercel-project.json"
          pnpm dlx vercel@59.3.0 api "/v9/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}" > "$RUNNER_TEMP/vercel-domains.json"
          pnpm dlx vercel@59.3.0 curl /release-manifest.json --deployment "$DEPLOYMENT_URL" -- \
            --fail --silent --show-error --output "$RUNNER_TEMP/candidate-release-manifest.json"
          pnpm dlx vercel@59.3.0 curl / --deployment "$DEPLOYMENT_URL" -- \
            --fail --silent --show-error --output "$RUNNER_TEMP/candidate-index.html"
          test -s "$RUNNER_TEMP/candidate-index.html"
          node scripts/finance_production_release_guard.js verify-candidate \
            --local-manifest www/release-manifest.json \
            --remote-manifest "$RUNNER_TEMP/candidate-release-manifest.json" \
            --candidate-sha "$CANDIDATE_SHA" \
            --deployment-url "$DEPLOYMENT_URL"
          node scripts/finance_production_release_guard.js verify-frontend-contract \
            --index "$RUNNER_TEMP/candidate-index.html" \
            --manifest "$RUNNER_TEMP/candidate-release-manifest.json" \
            --candidate-sha "$CANDIDATE_SHA"
          node scripts/finance_production_release_guard.js verify-vercel-target \
            --deployment-json "$RUNNER_TEMP/candidate-deployment.json" \
            --project-json "$RUNNER_TEMP/vercel-project.json" \
            --domains-json "$RUNNER_TEMP/vercel-domains.json" \
            --candidate-sha "$CANDIDATE_SHA" \
            --deployment-url "$DEPLOYMENT_URL"
          DEPLOYMENT_ID="$(node -e 'const f=require(process.argv[1]); const id=String(f.id||f.uid||""); if(!/^dpl_[A-Za-z0-9]+$/.test(id)) process.exit(1); process.stdout.write(id)' "$RUNNER_TEMP/candidate-deployment.json")"
          MANIFEST_SHA256="$(node scripts/finance_production_release_guard.js manifest-sha --manifest www/release-manifest.json)"
          echo "$DEPLOYMENT_URL" > "$RUNNER_TEMP/candidate-deployment-url.txt"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$MANIFEST_SHA256" >> "$GITHUB_OUTPUT"

      - name: Seal exact candidate, DB contracts and migration catalog as immutable artifact
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_candidate.outputs.deployment_url }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/finance-verified-candidate"
          mkdir -p "$BUNDLE/release-tools/scripts" "$BUNDLE/release-tools/supabase/migrations"
          cp "$RUNNER_TEMP/candidate-deployment-url.txt" "$BUNDLE/deployment-url.txt"
          cp "$RUNNER_TEMP/candidate-deployment.json" "$BUNDLE/candidate-deployment.json"
          cp "$RUNNER_TEMP/candidate-release-manifest.json" "$BUNDLE/candidate-release-manifest.json"
          cp "$RUNNER_TEMP/candidate-index.html" "$BUNDLE/candidate-index.html"
          cp www/release-manifest.json "$BUNDLE/local-release-manifest.json"
          cp scripts/finance_production_release_guard.js "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_production_db_preflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_production_db_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_production_db_fingerprint.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_audit_20260907_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_audit_20260907_fingerprint.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_cases_20260908_fingerprint.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_finalize_accounting_lines_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_finalize_accounting_lines_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_utility_tax_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_utility_tax_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_reports_20260910_fingerprint.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_amount_search_fingerprint.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_reporting_integrity_fingerprint.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_audit_readiness_fingerprint.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_audit_readiness_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_audit_readiness_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_employee_reliability_fingerprint.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_employee_reliability_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_employee_reliability_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_approval_history_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_approval_history_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_statement_source_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_ar_mapping_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_ar_mapping_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_dashboard_scope_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_dashboard_scope_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_google_projection_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_google_projection_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_approval_search_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_approval_search_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_approval_history_summary_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_approval_history_summary_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_approval_history_summary_fingerprint.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_invoice_select_initplan_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_invoice_select_initplan_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_startup_bundle.js "$BUNDLE/release-tools/scripts/"
          mkdir -p "$BUNDLE/release-tools/assets/vendor"
          cp assets/vendor/supabase-js-2.111.0.umd.js assets/vendor/supabase-js-2.111.0.LICENSE assets/vendor/supabase-js-2.111.0.provenance.json "$BUNDLE/release-tools/assets/vendor/"
          cp scripts/finance_statement_source_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_statement_source_fingerprint.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_ar_reconciliation_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_tax_source_integrity_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_ar_reconciliation_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_tax_source_integrity_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_amount_search_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_amount_search_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_canonical_receivables_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_canonical_receivables_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_reporting_profiles_postflight.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_reporting_profiles_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_production_authenticated_canary.sql "$BUNDLE/release-tools/scripts/"
          cp scripts/finance_production_human_accounting_canary.sql "$BUNDLE/release-tools/scripts/"
          cp supabase/config.toml "$BUNDLE/release-tools/supabase/config.toml"
          cp supabase/migrations/*.sql "$BUNDLE/release-tools/supabase/migrations/"
          node scripts/finance_production_release_guard.js create-receipt \
            --output "$BUNDLE/verified-candidate-receipt.json" \
            --deployment-json "$BUNDLE/candidate-deployment.json" \
            --manifest "$BUNDLE/local-release-manifest.json" \
            --index "$BUNDLE/candidate-index.html" \
            --candidate-sha "$CANDIDATE_SHA" \
            --release-phase "$RELEASE_PHASE" \
            --migration-versions "$MIGRATION_VERSIONS" \
            --deployment-url "$DEPLOYMENT_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload immutable verified candidate for DB and independently retryable promotion
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-verified-candidate-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/finance-verified-candidate
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  database:
    name: Apply or recover exact DB phase after candidate is sealed
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: finance-production
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RELEASE_PHASE: ${{ inputs.release_phase }}
      MIGRATION_VERSIONS: ${{ inputs.migration_versions }}
      EXPECTED_DEPLOYMENT_URL: ${{ needs.candidate.outputs.deployment_url }}
      EXPECTED_DEPLOYMENT_ID: ${{ needs.candidate.outputs.deployment_id }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.candidate.outputs.manifest_sha256 }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FINANCE_SUPABASE_URL: ${{ secrets.FINANCE_PRODUCTION_SUPABASE_URL }}
      FINANCE_SUPABASE_ANON_KEY: ${{ secrets.FINANCE_PRODUCTION_SUPABASE_ANON_KEY }}
      FINANCE_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FINANCE_PRODUCTION_SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.FINANCE_PRODUCTION_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.FINANCE_PRODUCTION_VERCEL_PROJECT_ID }}
      FINANCE_PRODUCTION_DOMAIN: finance.suiyuecare.com
      NO_COLOR: "1"
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Use fixed Node 22 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Use fixed pnpm runtime
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.21.0
          run_install: false

      - name: Use fixed Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0

      - name: Download the sealed candidate from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: finance-verified-candidate-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/verified-candidate

      - name: Link the pinned Supabase CLI to the immutable Finance project
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/verified-candidate/release-tools"
          node "$TOOLS/scripts/finance_production_release_guard.js" validate-target \
            --candidate-sha "$CANDIDATE_SHA" --release-phase "$RELEASE_PHASE" \
            --migration-versions "$MIGRATION_VERSIONS" \
            --project-ref "$FINANCE_PRODUCTION_SUPABASE_PROJECT_REF"
          supabase link --project-ref "$FINANCE_PRODUCTION_SUPABASE_PROJECT_REF" \
            --workdir "$TOOLS" --yes

      - name: Prove the sealed browser credential and read-only Supabase runtime before DB mutation
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/verified-candidate"
          TOOLS="$BUNDLE/release-tools"
          GUARD="$TOOLS/scripts/finance_production_release_guard.js"
          (cd "$TOOLS" && supabase projects api-keys \
            --project-ref "$FINANCE_PRODUCTION_SUPABASE_PROJECT_REF" --output json) > "$RUNNER_TEMP/supabase-api-keys.json"
          node "$GUARD" verify-supabase-public-key \
            --api-keys-json "$RUNNER_TEMP/supabase-api-keys.json"
          SUPABASE_BASE="${FINANCE_SUPABASE_URL%/}"
          AUTH_HEADER=()
          if [[ "$FINANCE_SUPABASE_ANON_KEY" == eyJ* ]]; then
            AUTH_HEADER=(-H "Authorization: Bearer $FINANCE_SUPABASE_ANON_KEY")
          fi
          curl --fail --silent --show-error \
            -H "apikey: $FINANCE_SUPABASE_ANON_KEY" \
            "$SUPABASE_BASE/auth/v1/settings" \
            --output "$RUNNER_TEMP/supabase-auth-settings.json"
          node -e 'const f=require(process.argv[1]); if(f.external?.google!==true) throw new Error("Google OAuth is not enabled in Finance Auth settings")' \
            "$RUNNER_TEMP/supabase-auth-settings.json"
          curl --fail --silent --show-error \
            -H "apikey: $FINANCE_SUPABASE_ANON_KEY" "${AUTH_HEADER[@]}" \
            "$SUPABASE_BASE/rest/v1/finance_users?select=id&limit=1" \
            --output "$RUNNER_TEMP/supabase-rest-probe.json"
          probe_rpc() {
            local name="$1"
            local payload="$2"
            local result="$RUNNER_TEMP/${name}-probe.json"
            local status
            status="$(curl --silent --show-error --write-out '%{http_code}' \
              --request POST -H "apikey: $FINANCE_SUPABASE_ANON_KEY" "${AUTH_HEADER[@]}" \
              -H 'Content-Type: application/json' --data "$payload" \
              "$SUPABASE_BASE/rest/v1/rpc/$name" --output "$result")"
            test "$status" = "401"
            node -e 'const f=require(process.argv[1]); if(f.code!=="42501") throw new Error("RPC probe did not reach the protected route")' "$result"
          }
          probe_rpc finance_submit_expense_request \
            '{"p_form":{},"p_org_unit_id":null,"p_legal_entity_code":"E1","p_actor_requests":[]}'
          probe_rpc finance_resubmit_expense_request \
            '{"p_form_id":"release-probe","p_form_state":{},"p_org_unit_id":null,"p_legal_entity_code":"E1","p_actor_requests":[]}'

      - name: Revalidate receipt, remote manifest and immutable Vercel target
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/verified-candidate"
          TOOLS="$BUNDLE/release-tools"
          GUARD="$TOOLS/scripts/finance_production_release_guard.js"
          DEPLOYMENT_URL="$(tr -d '\r\n' < "$BUNDLE/deployment-url.txt")"
          test "$DEPLOYMENT_URL" = "$EXPECTED_DEPLOYMENT_URL"
          test "$(node "$GUARD" manifest-sha --manifest "$BUNDLE/local-release-manifest.json")" = "$EXPECTED_MANIFEST_SHA256"
          node -e 'const f=require(process.argv[1]); if(String(f.id||f.uid||"")!==process.env.EXPECTED_DEPLOYMENT_ID) throw new Error("sealed deployment ID differs from candidate job output")' "$BUNDLE/candidate-deployment.json"
          node "$GUARD" validate-target \
            --candidate-sha "$CANDIDATE_SHA" --release-phase "$RELEASE_PHASE" \
            --migration-versions "$MIGRATION_VERSIONS" \
            --project-ref "$FINANCE_PRODUCTION_SUPABASE_PROJECT_REF"
          node "$GUARD" verify-receipt \
            --receipt "$BUNDLE/verified-candidate-receipt.json" \
            --deployment-json "$BUNDLE/candidate-deployment.json" \
            --manifest "$BUNDLE/local-release-manifest.json" \
            --index "$BUNDLE/candidate-index.html" \
            --candidate-sha "$CANDIDATE_SHA" --release-phase "$RELEASE_PHASE" \
            --migration-versions "$MIGRATION_VERSIONS" \
            --deployment-url "$DEPLOYMENT_URL" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          DEPLOYMENT_HOST="${DEPLOYMENT_URL#https://}"
          DEPLOYMENT_HOST="${DEPLOYMENT_HOST%/}"
          pnpm dlx vercel@59.3.0 api "/v13/deployments/${DEPLOYMENT_HOST}?teamId=${VERCEL_ORG_ID}" > "$RUNNER_TEMP/database-candidate-deployment.json"
