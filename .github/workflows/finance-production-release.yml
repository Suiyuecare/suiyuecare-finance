          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/verified-candidate"
          DEPLOYMENT_URL="$(tr -d '\r\n' < "$BUNDLE/deployment-url.txt")"
          PROMOTED=0
          for ATTEMPT in 1 2 3; do
            if pnpm dlx vercel@59.3.0 promote "$DEPLOYMENT_URL" --yes; then PROMOTED=1; break; fi
            echo "Promotion attempt $ATTEMPT failed; retrying the same sealed URL without rebuild." >&2
            sleep 5
          done
          test "$PROMOTED" = "1"

      - name: Read back exact production deployment and manifest
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/verified-candidate"
          GUARD="$BUNDLE/release-tools/scripts/finance_production_release_guard.js"
          VERIFIED=0
          for ATTEMPT in 1 2 3 4 5 6; do
            if pnpm dlx vercel@59.3.0 api "/v13/deployments/${FINANCE_PRODUCTION_DOMAIN}?teamId=${VERCEL_ORG_ID}" > "$RUNNER_TEMP/promoted-deployment.json" \
              && pnpm dlx vercel@59.3.0 api "/v4/aliases/${FINANCE_PRODUCTION_DOMAIN}?teamId=${VERCEL_ORG_ID}" > "$RUNNER_TEMP/production-alias.json" \
              && pnpm dlx vercel@59.3.0 curl /release-manifest.json --deployment "https://${FINANCE_PRODUCTION_DOMAIN}/" -- \
                --fail --silent --show-error --output "$RUNNER_TEMP/production-release-manifest.json" \
              && pnpm dlx vercel@59.3.0 curl / --deployment "https://${FINANCE_PRODUCTION_DOMAIN}/" -- \
                --fail --silent --show-error --output "$RUNNER_TEMP/production-index.html" \
              && node "$GUARD" verify-promotion \
                --candidate-deployment-json "$BUNDLE/candidate-deployment.json" \
                --promoted-deployment-json "$RUNNER_TEMP/promoted-deployment.json" \
                --production-alias-json "$RUNNER_TEMP/production-alias.json" \
                --production-manifest "$RUNNER_TEMP/production-release-manifest.json" \
                --candidate-manifest "$BUNDLE/local-release-manifest.json" \
              && node "$GUARD" verify-frontend-contract \
                --index "$RUNNER_TEMP/production-index.html" \
                --manifest "$RUNNER_TEMP/production-release-manifest.json" \
                --candidate-sha "$CANDIDATE_SHA"; then VERIFIED=1; break; fi
            echo "Production alias readback attempt $ATTEMPT has not converged to the sealed candidate." >&2
            sleep 5
          done
          test "$VERIFIED" = "1"
